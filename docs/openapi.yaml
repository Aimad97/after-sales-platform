                        content: { application/json: { schema: { $ref: '#/components/schemas/RepairEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /api/repairs/{repair}/start:
        post:
            tags: [Repairs]
            summary: Start repair work
            operationId: startRepair
            x-required-permission: admin/super admin or assigned technician with repairs.update
            parameters: [{ $ref: '#/components/parameters/RepairId' }]
            responses:
                '200':
                    {
                        description: Started repair.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/RepairEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /api/repairs/{repair}/complete:
        post:
            tags: [Repairs]
            summary: Complete a repair
            operationId: completeRepair
            x-required-permission: admin/super admin or assigned technician with repairs.update
            parameters: [{ $ref: '#/components/parameters/RepairId' }]
            requestBody:
                { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompleteRepairRequest' } } } }
            responses:
                '200':
                    {
                        description: Completed repair and repair outcome.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/RepairEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /api/tickets/{ticket}/attachments:
        get: &ticketAttachments
            tags: [Attachments]
            summary: List ticket attachments
            operationId: listTicketAttachments
            x-required-permission: tickets.view
            parameters: [{ $ref: '#/components/parameters/TicketUuid' }]
            responses:
                '200':
                    {
                        description: Attachment collection.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/ListEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
        post: &uploadTicketAttachment
            tags: [Attachments]
            summary: Upload a ticket attachment
            operationId: uploadTicketAttachment
            x-required-permission: tickets.update
            parameters: [{ $ref: '#/components/parameters/TicketUuid' }]
            requestBody: { $ref: '#/components/requestBodies/AttachmentUpload' }
            responses:
                '201':
                    {
                        description: Created attachment metadata.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/AttachmentEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '429': { $ref: '#/components/responses/TooManyRequests' }

    /api/products/{product}/attachments:
        get:
            tags: [Attachments]
            summary: List product attachments
            operationId: listProductAttachments
            x-required-permission: products.view
            parameters: [{ $ref: '#/components/parameters/ProductUuid' }]
            responses:
                '200':
                    {
                        description: Attachment collection.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/ListEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
        post:
            tags: [Attachments]
            summary: Upload a product attachment
            operationId: uploadProductAttachment
            x-required-permission: products.update
            parameters: [{ $ref: '#/components/parameters/ProductUuid' }]
            requestBody: { $ref: '#/components/requestBodies/AttachmentUpload' }
            responses:
                '201':
                    {
                        description: Created attachment metadata.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/AttachmentEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '429': { $ref: '#/components/responses/TooManyRequests' }

    /api/repairs/{repair}/attachments:
        get:
            tags: [Attachments]
            summary: List repair attachments
            operationId: listRepairAttachments
            x-required-permission: repair view policy
            parameters: [{ $ref: '#/components/parameters/RepairId' }]
            responses:
                '200':
                    {
                        description: Attachment collection.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/ListEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
        post:
            tags: [Attachments]
            summary: Upload a repair attachment
            operationId: uploadRepairAttachment
            x-required-permission: repair update policy
            parameters: [{ $ref: '#/components/parameters/RepairId' }]
            requestBody: { $ref: '#/components/requestBodies/AttachmentUpload' }
            responses:
                '201':
                    {
                        description: Created attachment metadata.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/AttachmentEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '429': { $ref: '#/components/responses/TooManyRequests' }

    /api/client/tickets/{ticket}/attachments:
        get:
            <<: *ticketAttachments
            summary: List attachments for an owned portal ticket
            operationId: listPortalTicketAttachments
            x-required-permission: linked client owner
        post:
            <<: *uploadTicketAttachment
            summary: Upload to an owned, non-terminal portal ticket
            operationId: uploadPortalTicketAttachment
            x-required-permission: linked client owner

    /api/attachments/{attachment}/preview:
        get:
            tags: [Attachments]
            summary: Preview a private attachment
            operationId: previewAttachment
            x-required-permission: parent resource view policy
            parameters: [{ $ref: '#/components/parameters/AttachmentUuid' }]
            responses:
                '200': { $ref: '#/components/responses/BinaryResponse' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/attachments/{attachment}/download:
        get:
            tags: [Attachments]
            summary: Download a private attachment
            operationId: downloadAttachment
            x-required-permission: parent resource view policy
            parameters: [{ $ref: '#/components/parameters/AttachmentUuid' }]
            responses:
                '200': { $ref: '#/components/responses/BinaryResponse' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/attachments/{attachment}:
        delete:
            tags: [Attachments]
            summary: Delete a private attachment
            operationId: deleteAttachment
            x-required-permission: parent resource update policy
            parameters: [{ $ref: '#/components/parameters/AttachmentUuid' }]
            responses:
                '200': { $ref: '#/components/responses/MessageResponse' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/notifications:
        get:
            tags: [Notifications]
            summary: List the current user's notifications
            operationId: listNotifications
            x-required-permission: current user scope
            parameters:
                - { name: unread, in: query, schema: { type: boolean } }
                - { $ref: '#/components/parameters/PerPage100' }
            responses:
                '200':
                    {
                        description: Paginated current-user notifications.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedEnvelope' } } },
                    }
                '401': { $ref: '#/components/responses/Unauthenticated' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /api/notifications/unread-count:
        get:
            tags: [Notifications]
            summary: Get the current user's unread count
            operationId: unreadNotificationCount
            x-required-permission: current user scope
            responses:
                '200':
                    {
                        description: Unread count.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/CountEnvelope' } } },
                    }
                '401': { $ref: '#/components/responses/Unauthenticated' }

    /api/notifications/{notification}/read:
        patch:
            tags: [Notifications]
            summary: Mark one current-user notification as read
            description: A notification owned by another user is returned as 404.
            operationId: markNotificationRead
            x-required-permission: current user scope
            parameters: [{ $ref: '#/components/parameters/NotificationId' }]
            responses:
                '200':
                    {
                        description: Updated notification.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } },
                    }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/notifications/mark-all-read:
        post:
            tags: [Notifications]
            summary: Mark all current-user notifications as read
            operationId: markAllNotificationsRead
            x-required-permission: current user scope
            responses:
                '200':
                    {
                        description: Number marked as read.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/MarkedReadEnvelope' } } },
                    }
                '401': { $ref: '#/components/responses/Unauthenticated' }

    /api/dashboard:
        get:
            tags: [Dashboard]
            summary: Get the role-aware dashboard
            operationId: dashboard
            x-required-permission: dashboard.view or linked client portal access
            responses:
                '200':
                    {
                        description: Dashboard metrics scoped to the caller.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }

    /api/reports/{type}:
        get:
            tags: [Reports]
            summary: Generate a paginated report
            operationId: getReport
            x-required-permission: reports.view
            parameters:
                - { $ref: '#/components/parameters/ReportType' }
                - { $ref: '#/components/parameters/DateFrom' }
                - { $ref: '#/components/parameters/DateTo' }
                - { name: technician_id, in: query, schema: { type: integer } }
                - { name: status, in: query, schema: { type: string }, description: Ticket status, or repair result for repairs reports. }
                - { name: priority, in: query, schema: { $ref: '#/components/schemas/TicketPriority' } }
                - { name: brand_id, in: query, schema: { type: integer } }
                - { name: category_id, in: query, schema: { type: integer } }
                - { name: product_id, in: query, schema: { type: integer } }
                - { name: warranty_state, in: query, schema: { $ref: '#/components/schemas/WarrantyStatus' } }
                - { name: client_id, in: query, schema: { type: integer } }
                - { $ref: '#/components/parameters/PerPage100' }
                - { $ref: '#/components/parameters/Page' }
            responses:
                '200':
                    {
                        description: Report type,
                        columns,
                        applied filters,
                        rows,
                        pagination metadata,
                        and links.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/ReportEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /api/reports/{type}/exports:
        post:
            tags: [Reports]
            summary: Queue a CSV report export
            description: Accepts the same filters as the report endpoint plus required format=csv. Limited to 10/minute.
            operationId: exportReport
            x-required-permission: reports.view
            parameters: [{ $ref: '#/components/parameters/ReportType' }]
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReportExportRequest' } } } }
            responses:
                '202':
                    {
                        description: Queued report export.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '429': { $ref: '#/components/responses/TooManyRequests' }

    /api/reports/exports/{export}:
        get:
            tags: [Reports]
            summary: Get report export status
            operationId: getReportExport
            x-required-permission: reports.view and requesting user; admin/super admin override
            parameters: [{ $ref: '#/components/parameters/ExportUuid' }]
            responses:
                '200':
                    {
                        description: Export status and download metadata.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/reports/exports/{export}/download:
        get:
            tags: [Reports]
            summary: Download a completed report export
            operationId: downloadReportExport
            x-required-permission: reports.view and requesting user; admin/super admin override
            parameters: [{ $ref: '#/components/parameters/ExportUuid' }]
            responses:
                '200': { description: CSV download., content: { text/csv: { schema: { type: string, format: binary } } } }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409':
                    {
                        description: Export is not complete.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
                    }
                '410':
                    { description: Export has expired., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

    /api/audit-logs:
        get:
            tags: [Audit Logs]
            summary: List administrative audit logs
            operationId: listAuditLogs
            x-required-permission: admin or super_admin role
            parameters:
                - { name: user_id, in: query, schema: { type: integer } }
                - { name: action, in: query, schema: { type: string, maxLength: 100 } }
                - { name: entity_type, in: query, schema: { type: string, maxLength: 150 } }
                - { $ref: '#/components/parameters/DateFrom' }
                - { $ref: '#/components/parameters/DateTo' }
                - { $ref: '#/components/parameters/PerPage100' }
            responses:
                '200':
                    {
                        description: Paginated audit records.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }

components:
    securitySchemes:
        cookieAuth:
            type: apiKey
            in: cookie
            name: laravel_session
            description: Stateful Laravel Sanctum session. Fetch `/sanctum/csrf-cookie`; send cookies and `X-XSRF-TOKEN` for mutations.

    parameters:
        Search: { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
        Direction: { name: direction, in: query, required: false, schema: { type: string, enum: [asc, desc] } }
        PerPage100: { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        PerPage50: { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50 } }
        Page: { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
        DateFrom: { name: date_from, in: query, required: false, schema: { type: string, format: date } }
        DateTo:
            {
                name: date_to,
                in: query,
                required: false,
                schema: { type: string, format: date },
                description: Must be on or after date_from.,
            }
        UserUuid: { name: user, in: path, required: true, schema: { type: string, format: uuid } }
        ClientUuid: { name: client, in: path, required: true, schema: { type: string, format: uuid } }
        ProductUuid: { name: product, in: path, required: true, schema: { type: string, format: uuid } }
        TicketUuid: { name: ticket, in: path, required: true, schema: { type: string, format: uuid } }
        WarrantyUuid: { name: warranty, in: path, required: true, schema: { type: string, format: uuid } }
        AttachmentUuid: { name: attachment, in: path, required: true, schema: { type: string, format: uuid } }
        ExportUuid: { name: export, in: path, required: true, schema: { type: string, format: uuid } }
        CategoryId: { name: category, in: path, required: true, schema: { type: integer, minimum: 1 } }
        BrandId: { name: brand, in: path, required: true, schema: { type: integer, minimum: 1 } }
        InvoiceId: { name: invoice, in: path, required: true, schema: { type: integer, minimum: 1 } }
        TechnicianId: { name: technician, in: path, required: true, schema: { type: integer, minimum: 1 } }
        RepairId: { name: repair, in: path, required: true, schema: { type: integer, minimum: 1 } }
        NotificationId: { name: notification, in: path, required: true, schema: { type: string, format: uuid } }
        ReportType:
            name: type
            in: path
            required: true
            schema: { type: string, enum: [tickets, repairs, warranties, technician_performance, defective_products, client_history] }

    requestBodies:
        AttachmentUpload:
            required: true
            description: Private file, maximum 10,240 KiB by default. JPEG, PNG, WebP, PDF, TXT, CSV, DOC/DOCX, XLS/XLSX.
            content:
                multipart/form-data:
                    schema:
                        type: object
                        required: [file]
                        properties:
                            file: { type: string, format: binary }

    responses:
        MessageResponse:
            description: Operation completed.
            content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } }
        BinaryResponse:
            description: Authorized private binary content.
            content: { application/octet-stream: { schema: { type: string, format: binary } } }
        Unauthenticated:
            description: Missing or invalid authentication session.
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { message: Unauthenticated. } } }
        Forbidden:
            description: The authenticated user is not authorized.
            content:
                { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { message: This action is unauthorized. } } }
        NotFound:
            description: Resource not found. Ownership-protected portal resources also use this response.
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { message: Resource not found. } } }
        ValidationError:
            description: Input or business-rule validation failed.
            content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
        PageExpired:
            description: CSRF token missing or expired.
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { message: Page expired. } } }
        TooManyRequests:
            description: Rate limit exceeded.
            headers:
                Retry-After: { schema: { type: integer }, description: Seconds until retry. }
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { message: Too many requests. } } }

    schemas:
        Error:
            type: object
            required: [message]
            properties:
                message: { type: string }
        ValidationError:
            type: object
            required: [message, errors]
            properties:
                message: { type: string, example: The given data was invalid. }
                errors:
                    type: object
                    additionalProperties:
                        type: array
                        items: { type: string }
        Message:
            type: object
            required: [message]
            properties:
                message: { type: string }
        DataEnvelope:
            type: object
            required: [data]
            properties:
                data: { type: object, additionalProperties: true }
        ListEnvelope:
            type: object
            required: [data]
            properties:
                data: { type: array, items: { type: object, additionalProperties: true } }
        PaginatedEnvelope:
            type: object
            required: [data, links, meta]
            properties:
                data: { type: array, items: { type: object, additionalProperties: true } }
                links:
                    type: object
                    properties:
                        first: { type: string, nullable: true }
                        last: { type: string, nullable: true }
                        prev: { type: string, nullable: true }
                        next: { type: string, nullable: true }
                meta:
                    type: object
                    properties:
                        current_page: { type: integer }
                        from: { type: integer, nullable: true }
                        last_page: { type: integer }
                        path: { type: string }
                        per_page: { type: integer }
                        to: { type: integer, nullable: true }
                        total: { type: integer }
        HealthEnvelope:
            type: object
            required: [data]
            properties:
                data:
                    type: object
                    required: [status, service, timestamp]
                    properties:
                        status: { type: string, enum: [ok] }
                        service: { type: string }
                        timestamp: { type: string, format: date-time }
        CountEnvelope:
            type: object
            required: [data]
            properties:
                data:
                    type: object
                    required: [count]
                    properties: { count: { type: integer, minimum: 0 } }
        MarkedReadEnvelope:
            type: object
            required: [data]
            properties:
                data:
                    type: object
                    required: [marked_as_read]
                    properties: { marked_as_read: { type: integer, minimum: 0 } }

        UserStatus: { type: string, enum: [active, invited, suspended, archived] }
        ClientType: { type: string, enum: [individual, company] }
        WarrantyStatus: { type: string, enum: [active, expired, void, replaced] }
        TechnicianAvailability: { type: string, enum: [available, busy, unavailable, leave] }
        TicketPriority: { type: string, enum: [low, normal, high, urgent] }
        TicketSource: { type: string, enum: [store, phone, email, web] }
        TicketStatus:
            type: string
            enum:
                [
                    opened,
                    received,
                    awaiting_diagnosis,
                    diagnosing,
                    awaiting_customer_approval,
                    awaiting_part,
                    repairing,
                    testing,
                    repaired,
                    ready_for_pickup,
                    delivered,
                    closed,
                    cancelled,
                ]
        RepairResult: { type: string, enum: [repaired, partially_repaired, unrepairable, replacement_required] }

        LoginRequest:
            type: object
            additionalProperties: false
            required: [email, password]
            properties:
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, format: password, maxLength: 255 }
                remember: { type: boolean, default: false }
        ForgotPasswordRequest:
            type: object
            additionalProperties: false
            required: [email]
            properties: { email: { type: string, format: email, maxLength: 255 } }
        ResetPasswordRequest:
            type: object
            additionalProperties: false
            required: [token, email, password, password_confirmation]
            properties:
                token: { type: string }
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, format: password, maxLength: 255, description: Laravel Password::defaults(). }
                password_confirmation: { type: string, format: password, description: Must equal password. }
        ChangePasswordRequest:
            type: object
            additionalProperties: false
            required: [current_password, password, password_confirmation]
            properties:
                current_password: { type: string, format: password, description: Must match the current web-guard password. }
                password: { type: string, format: password, maxLength: 255, description: Laravel Password::defaults(). }
                password_confirmation: { type: string, format: password, description: Must equal password. }

        User:
            type: object
            required: [id, uuid, first_name, last_name, email, locale, timezone, status, roles, permissions]
            properties:
                id: { type: integer }
                uuid: { type: string, format: uuid }
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string, nullable: true }
                locale: { type: string }
                timezone: { type: string }
                client_id: { type: integer, nullable: true }
                client: { type: object, nullable: true, additionalProperties: true }
                status: { $ref: '#/components/schemas/UserStatus' }
                last_login_at: { type: string, format: date-time, nullable: true }
                roles: { type: array, items: { type: string } }
                permissions: { type: array, items: { type: string } }
                technician: { type: object, nullable: true, additionalProperties: true }
        UserEnvelope:
            type: object
            required: [data]
            properties: { data: { $ref: '#/components/schemas/User' } }
        CreateUserRequest:
            type: object
            additionalProperties: false
            required: [first_name, last_name, email, status, locale, timezone, password, password_confirmation, roles]
            properties:
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                email: { type: string, format: email, maxLength: 255, description: Must be unique among users. }
                phone: { type: string, nullable: true, maxLength: 30 }
                status: { $ref: '#/components/schemas/UserStatus' }
                locale: { type: string, maxLength: 10 }
                timezone: { type: string, description: Valid PHP timezone identifier. }
                client_id: { type: integer, nullable: true, description: Existing non-deleted client ID. }
                password: { type: string, format: password, maxLength: 255, description: Laravel Password::defaults(). }
