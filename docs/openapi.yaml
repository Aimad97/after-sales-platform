openapi: 3.0.3
info:
    title: Intelligent After-Sales Service and Warranty API
    version: 1.0.0
    description: |
        Contract generated from the Laravel routes, controllers, Form Requests, policies,
        resources, enums, and exception renderer. Browser clients authenticate through a
        stateful Laravel Sanctum session. Obtain the CSRF cookie before state-changing calls.
servers:
    - url: http://127.0.0.1:8000
      description: Local development
tags:
    - { name: System }
    - { name: Auth }
    - { name: Search }
    - { name: Users }
    - { name: Technicians }
    - { name: Clients }
    - { name: Products }
    - { name: Invoices }
    - { name: Warranties }
    - { name: Tickets }
    - { name: Repairs }
    - { name: Attachments }
    - { name: Notifications }
    - { name: Dashboard }
    - { name: Reports }
    - { name: Audit Logs }
security:
    - cookieAuth: []
paths:
    /api/health:
        get:
            tags: [System]
            summary: Check API health
            operationId: health
            security: []
            x-required-permission: none
            responses:
                '200':
                    description: Service status and current timestamp.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/HealthEnvelope' }
                '429': { $ref: '#/components/responses/TooManyRequests' }

    /api/auth/login:
        post:
            tags: [Auth]
            summary: Sign in and create a Sanctum session
            description: Limited to 5 attempts per email/IP and 20 per IP per minute.
            operationId: login
            security: []
            x-required-permission: none
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/LoginRequest' }
            responses:
                '200':
                    description: Authenticated user; the session is carried by cookies.
                    content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } }
                '422': { $ref: '#/components/responses/ValidationError' }
                '429': { $ref: '#/components/responses/TooManyRequests' }

    /api/auth/forgot-password:
        post:
            tags: [Auth]
            summary: Request a password reset link
            description: Always returns a generic result to prevent account enumeration.
            operationId: forgotPassword
            security: []
            x-required-permission: none
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: '#/components/schemas/ForgotPasswordRequest' } } }
            responses:
                '200': { $ref: '#/components/responses/MessageResponse' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '429': { $ref: '#/components/responses/TooManyRequests' }

    /api/auth/reset-password:
        post:
            tags: [Auth]
            summary: Reset a password
            operationId: resetPassword
            security: []
            x-required-permission: none
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: '#/components/schemas/ResetPasswordRequest' } } }
            responses:
                '200': { $ref: '#/components/responses/MessageResponse' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '429': { $ref: '#/components/responses/TooManyRequests' }

    /api/auth/logout:
        post:
            tags: [Auth]
            summary: End the current session
            operationId: logout
            x-required-permission: authenticated
            responses:
                '200': { $ref: '#/components/responses/MessageResponse' }
                '401': { $ref: '#/components/responses/Unauthenticated' }
                '419': { $ref: '#/components/responses/PageExpired' }
                '429': { $ref: '#/components/responses/TooManyRequests' }

    /api/auth/me:
        get:
            tags: [Auth]
            summary: Get the authenticated user
            operationId: currentUser
            x-required-permission: authenticated
            responses:
                '200':
                    {
                        description: Current user with roles and permissions.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } },
                    }
                '401': { $ref: '#/components/responses/Unauthenticated' }
                '429': { $ref: '#/components/responses/TooManyRequests' }

    /api/auth/password:
        put:
            tags: [Auth]
            summary: Change the authenticated user's password
            operationId: changePassword
            x-required-permission: authenticated
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: '#/components/schemas/ChangePasswordRequest' } } }
            responses:
                '200': { $ref: '#/components/responses/MessageResponse' }
                '401': { $ref: '#/components/responses/Unauthenticated' }
                '419': { $ref: '#/components/responses/PageExpired' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /api/search:
        get:
            tags: [Search]
            summary: Search across authorized resource categories
            description: Categories and records are omitted when the caller lacks their view permission. Limited to 60 requests/minute.
            operationId: globalSearch
            x-required-permission: authenticated; results are authorization-aware
            parameters:
                - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
                - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10, default: 5 } }
            responses:
                '200':
                    {
                        description: Categorized clients,
                        tickets,
                        invoices,
                        serials/products,
                        and technicians visible to the caller.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/SearchEnvelope' } } },
                    }
                '401': { $ref: '#/components/responses/Unauthenticated' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '429': { $ref: '#/components/responses/TooManyRequests' }

    /api/users/roles:
        get:
            tags: [Users]
            summary: List assignable roles
            operationId: listRoles
            x-required-permission: users.view
            responses:
                '200': { description: Role list., content: { application/json: { schema: { $ref: '#/components/schemas/ListEnvelope' } } } }
                '401': { $ref: '#/components/responses/Unauthenticated' }
                '403': { $ref: '#/components/responses/Forbidden' }

    /api/users:
        get:
            tags: [Users]
            summary: List users
            operationId: listUsers
            x-required-permission: users.view
            parameters:
                - { $ref: '#/components/parameters/Search' }
                - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
                - { name: role, in: query, schema: { type: string } }
                - { name: technician, in: query, schema: { type: boolean } }
                - {
                      name: sort,
                      in: query,
                      schema: { type: string, enum: [first_name, last_name, email, status, last_login_at, created_at] },
                  }
                - { $ref: '#/components/parameters/Direction' }
                - { $ref: '#/components/parameters/PerPage100' }
            responses:
                '200':
                    {
                        description: Paginated users.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedEnvelope' } } },
                    }
                '401': { $ref: '#/components/responses/Unauthenticated' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }
        post:
            tags: [Users]
            summary: Create a user
            operationId: createUser
            x-required-permission: users.create
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateUserRequest' } } } }
            responses:
                '201':
                    { description: Created user., content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
                '401': { $ref: '#/components/responses/Unauthenticated' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /api/users/{user}:
        parameters:
            - { $ref: '#/components/parameters/UserUuid' }
        get:
            tags: [Users]
            summary: Get a user
            operationId: getUser
            x-required-permission: users.view
            responses:
                '200': { description: User., content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
                '401': { $ref: '#/components/responses/Unauthenticated' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
        put: &updateUser
            tags: [Users]
            summary: Update a user
            operationId: replaceUser
            x-required-permission: users.update
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateUserRequest' } } } }
            responses:
                '200':
                    { description: Updated user., content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
                '401': { $ref: '#/components/responses/Unauthenticated' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }
        patch:
            <<: *updateUser
            operationId: updateUser
        delete:
            tags: [Users]
            summary: Soft-delete a user
            operationId: deleteUser
            x-required-permission: users.delete
            responses:
                '200': { $ref: '#/components/responses/MessageResponse' }
                '401': { $ref: '#/components/responses/Unauthenticated' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/technicians:
        get:
            tags: [Technicians]
            summary: List technicians
            operationId: listTechnicians
            x-required-permission: users.view
            parameters:
                - { $ref: '#/components/parameters/Search' }
                - { name: availability_status, in: query, schema: { $ref: '#/components/schemas/TechnicianAvailability' } }
                - { name: skill_level, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
                - {
                      name: sort,
                      in: query,
                      schema: { type: string, enum: [employee_code, specialization, skill_level, availability_status, created_at] },
                  }
                - { $ref: '#/components/parameters/Direction' }
                - { $ref: '#/components/parameters/PerPage100' }
            responses:
                '200':
                    {
                        description: Paginated technicians.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }
        post:
            tags: [Technicians]
            summary: Create a technician profile
            operationId: createTechnician
            x-required-permission: users.create
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TechnicianWrite' } } } }
            responses:
                '201':
                    {
                        description: Created technician.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /api/technicians/{technician}:
        parameters: [{ $ref: '#/components/parameters/TechnicianId' }]
        get:
            tags: [Technicians]
            summary: Get a technician
            operationId: getTechnician
            x-required-permission: users.view
            responses:
                '200':
                    { description: Technician., content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
        put: &updateTechnician
            tags: [Technicians]
            summary: Update a technician
            operationId: replaceTechnician
            x-required-permission: users.update
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TechnicianUpdate' } } } }
            responses:
                '200':
                    {
                        description: Updated technician.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }
        patch:
            <<: *updateTechnician
            operationId: updateTechnician
        delete:
            tags: [Technicians]
            summary: Soft-delete a technician
            operationId: deleteTechnician
            x-required-permission: users.delete
            responses:
                '200': { $ref: '#/components/responses/MessageResponse' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/clients:
        get:
            tags: [Clients]
            summary: List clients
            operationId: listClients
            x-required-permission: clients.view
            parameters:
                - { $ref: '#/components/parameters/Search' }
                - { name: type, in: query, schema: { $ref: '#/components/schemas/ClientType' } }
                - {
                      name: sort,
                      in: query,
                      schema: { type: string, enum: [first_name, last_name, company_name, email, phone, city, type, created_at] },
                  }
                - { $ref: '#/components/parameters/Direction' }
                - { $ref: '#/components/parameters/PerPage100' }
            responses:
                '200':
                    {
                        description: Paginated clients.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }
        post:
            tags: [Clients]
            summary: Create a client
            operationId: createClient
            x-required-permission: clients.create
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClientCreate' } } } }
            responses:
                '201':
                    {
                        description: Created client.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/ClientEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /api/clients/{client}:
        parameters: [{ $ref: '#/components/parameters/ClientUuid' }]
        get:
            tags: [Clients]
            summary: Get a client
            operationId: getClient
            x-required-permission: clients.view
            responses:
                '200': { description: Client., content: { application/json: { schema: { $ref: '#/components/schemas/ClientEnvelope' } } } }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
        put: &updateClient
            tags: [Clients]
            summary: Update a client
            operationId: replaceClient
            x-required-permission: clients.update
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClientUpdate' } } } }
            responses:
                '200':
                    {
                        description: Updated client.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/ClientEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }
        patch:
            <<: *updateClient
            operationId: updateClient
        delete:
            tags: [Clients]
            summary: Soft-delete a client
            operationId: deleteClient
            x-required-permission: clients.delete
            responses:
                '200': { $ref: '#/components/responses/MessageResponse' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/clients/{client}/profile:
        get:
            tags: [Clients]
            summary: Get a client's staff profile
            operationId: getClientProfile
            x-required-permission: clients.view
            parameters: [{ $ref: '#/components/parameters/ClientUuid' }]
            responses:
                '200':
                    {
                        description: Client profile and summary.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/client/profile:
        get:
            tags: [Clients]
            summary: Get the current client's portal profile
            operationId: getPortalProfile
            x-required-permission: linked client owner
            responses:
                '200':
                    {
                        description: Portal-safe current client profile.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } },
                    }
                '401': { $ref: '#/components/responses/Unauthenticated' }
                '403': { $ref: '#/components/responses/Forbidden' }

    /api/categories:
        get:
            tags: [Products]
            summary: List categories
            operationId: listCategories
            x-required-permission: products.view
            parameters:
                - { $ref: '#/components/parameters/Search' }
                - { name: active, in: query, schema: { type: boolean } }
                - { name: sort, in: query, schema: { type: string, enum: [name, slug, active, created_at] } }
                - { $ref: '#/components/parameters/Direction' }
                - { $ref: '#/components/parameters/PerPage100' }
            responses:
                '200':
                    {
                        description: Paginated categories.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }
        post:
            tags: [Products]
            summary: Create a category
            operationId: createCategory
            x-required-permission: products.create
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryWrite' } } } }
            responses:
                '201':
                    {
                        description: Created category.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /api/categories/{category}:
        parameters: [{ $ref: '#/components/parameters/CategoryId' }]
        get:
            tags: [Products]
            summary: Get a category
            operationId: getCategory
            x-required-permission: products.view
            responses:
                '200': { description: Category., content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
        put: &updateCategory
            tags: [Products]
            summary: Update a category
            operationId: replaceCategory
            x-required-permission: products.update
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryUpdate' } } } }
            responses:
                '200':
                    {
                        description: Updated category.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }
        patch: { <<: *updateCategory, operationId: updateCategory }
        delete:
            tags: [Products]
            summary: Delete a category
            operationId: deleteCategory
            x-required-permission: products.delete
            responses:
                '200': { $ref: '#/components/responses/MessageResponse' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/brands:
        get:
            tags: [Products]
            summary: List brands
            operationId: listBrands
            x-required-permission: products.view
            parameters:
                - { $ref: '#/components/parameters/Search' }
                - { name: active, in: query, schema: { type: boolean } }
                - { name: sort, in: query, schema: { type: string, enum: [name, slug, active, created_at] } }
                - { $ref: '#/components/parameters/Direction' }
                - { $ref: '#/components/parameters/PerPage100' }
            responses:
                '200':
                    {
                        description: Paginated brands.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }
        post:
            tags: [Products]
            summary: Create a brand
            operationId: createBrand
            x-required-permission: products.create
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BrandWrite' } } } }
            responses:
                '201':
                    {
                        description: Created brand.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /api/brands/{brand}:
        parameters: [{ $ref: '#/components/parameters/BrandId' }]
        get:
            tags: [Products]
            summary: Get a brand
            operationId: getBrand
            x-required-permission: products.view
            responses:
                '200': { description: Brand., content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
        put: &updateBrand
            tags: [Products]
            summary: Update a brand
            operationId: replaceBrand
            x-required-permission: products.update
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BrandUpdate' } } } }
            responses:
                '200':
                    {
                        description: Updated brand.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }
        patch: { <<: *updateBrand, operationId: updateBrand }
        delete:
            tags: [Products]
            summary: Delete a brand
            operationId: deleteBrand
            x-required-permission: products.delete
            responses:
                '200': { $ref: '#/components/responses/MessageResponse' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }

    /api/products:
        get:
            tags: [Products]
            summary: List products
            operationId: listProducts
            x-required-permission: products.view
            parameters:
                - { $ref: '#/components/parameters/Search' }
                - { name: category_id, in: query, schema: { type: integer } }
                - { name: brand_id, in: query, schema: { type: integer } }
                - { name: active, in: query, schema: { type: boolean } }
                - {
                      name: sort,
                      in: query,
                      schema: { type: string, enum: [sku, name, slug, model, default_warranty_months, active, created_at] },
                  }
                - { $ref: '#/components/parameters/Direction' }
                - { $ref: '#/components/parameters/PerPage100' }
            responses:
                '200':
                    {
                        description: Paginated products.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }
        post:
            tags: [Products]
            summary: Create a product
            operationId: createProduct
            x-required-permission: products.create
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductCreate' } } } }
            responses:
                '201':
                    {
                        description: Created product.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/ProductEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /api/products/{product}:
        parameters: [{ $ref: '#/components/parameters/ProductUuid' }]
        get:
            tags: [Products]
            summary: Get a product
            operationId: getProduct
            x-required-permission: products.view
            responses:
                '200':
                    { description: Product., content: { application/json: { schema: { $ref: '#/components/schemas/ProductEnvelope' } } } }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
        put: &updateProduct
            tags: [Products]
            summary: Update a product
            operationId: replaceProduct
            x-required-permission: products.update
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductUpdate' } } } }
            responses:
                '200':
                    {
                        description: Updated product.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/ProductEnvelope' } } },
                    }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
